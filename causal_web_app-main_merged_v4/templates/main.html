<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>农业因果发现管理系统</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            padding: 20px;
            background-color: #4CAF50;
            color: white;
            font-size: 32px;
            font-weight: bold;
        }
        .main-content {
            flex: 1;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 80px; /* 为悬浮条预留空间 */
        }
        .variety-box {
            width: 95%;
            height: auto;
            max-width: 1200px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-top: 50px;
            margin-bottom: 20px;
        }
        .variety-box h3 {
            margin-top: 0;
            font-size: 32px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }
        .variety-box select, .variety-box input[type="text"] {
            padding: 10px 15px;
            font-size: 19px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
            transition: border-color 0.2s;
        }
        .variety-box select:focus, .variety-box input[type="text"]:focus {
            border-color: #4CAF50;
        }
        .variety-box select {
            min-width: 180px;
        }
        .variety-box input[type="text"] {
            min-width: 250px;
        }
        .variety-box button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 21px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .variety-box button:hover {
            background-color: #45a049;
            transform: translateY(-1px);
        }
        .variety-box button:active {
            transform: translateY(0);
        }
        .variety-box iframe {
            width: 100%;
            height: 720px;
            margin-top: 30px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
        }
        
        /* 品种管理表单布局 */
        .variety-form-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .variety-form-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .variety-form-row .row-label {
            font-size: 25px;
            color: #555;
            font-weight: 500;
            min-width: 120px;
        }
        .variety-form-row .file-name-display {
            color: #888;
            font-size: 20px;
            padding: 12px 16px;
            background-color: #f9f9f9;
            border-radius: 4px;
            border: 1px dashed #ddd;
        }
        .btn-secondary {
            background-color: #f0f0f0 !important;
            color: #333 !important;
            border: 1px solid #ddd !important;
        }
        .btn-secondary:hover {
            background-color: #e5e5e5 !important;
        }
        .btn-danger {
            background-color: #e74c3c !important;
        }
        .btn-danger:hover {
            background-color: #c0392b !important;
        }

        /* 悬浮条样式 - 修改后 */
        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #4CAF50;
            padding: 10px;
            box-sizing: border-box;
            z-index: 1000;
            display: flex;
            justify-content: center;
        }
        .footer-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }
        .footer-text {
            color: white;
            font-weight: bold;
            font-size: 26px;
            white-space: nowrap;
        }
        .footer-buttons {
            display: flex;
            gap: 20px;
        }
        .footer button {
            background-color: white;
            color: #4CAF50;
            border: none;
            padding: 16px 32px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 29px;
        }
        .footer button:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>
    <div class="header">
        农业因果图管理系统
    </div>
    <div class="main-content">
        <div class="variety-box">
            <h3>品种管理</h3>
            <div class="variety-form-section">
                <!-- 第一行：选择已有品种 -->
                <div class="variety-form-row">
                    <span class="row-label">选择品种</span>
                    <select id="variety_select" onchange="showVarietyImage()"></select>
                    <button onclick="confirmVarietySelection()">确认选择</button>
                    <!-- 确认选择后显示：上传候选图按钮 -->
                    <button id="upload_candidate_btn" onclick="openUploadCandidateModal()" style="display: none;">上传候选图</button>
                    <button class="btn-danger" onclick="deleteVariety()">删除品种</button>
                </div>
                <!-- 第二行：新建品种 -->
                <div class="variety-form-row">
                    <span class="row-label">新建品种</span>
                    <input type="text" id="variety_name_input" placeholder="输入品种名称" />
                    <button onclick="addVariety()">添加品种</button>
                </div>
            </div>
            <iframe id="variety_html_iframe"></iframe>
        </div>
    </div>

    <!-- 候选图上传模态框 -->
    <div id="candidateUploadModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25); z-index: 1100; min-width: 500px;">
        <h3 style="margin: 0 0 25px 0; font-size: 28px; color: #333; border-bottom: 2px solid #4CAF50; padding-bottom: 15px;">上传候选图</h3>
        <p id="candidate_modal_variety" style="margin-bottom: 20px; color: #555; font-size: 22px; font-weight: 500;">当前品种：</p>
        <div style="margin-bottom: 20px;">
            <input type="file" id="candidate_file_input" accept=".json" style="display: none;" />
            <button onclick="document.getElementById('candidate_file_input').click()" style="background-color: #f0f0f0; color: #333; border: 1px solid #ddd; padding: 15px 30px; border-radius: 5px; cursor: pointer; font-size: 20px;">选择文件</button>
            <span id="candidate_file_name" style="display: inline-block; margin-left: 15px; font-size: 20px; color: #888; padding: 15px 20px; background-color: #f9f9f9; border-radius: 5px; border: 1px dashed #ddd;">未选择任何文件</span>
        </div>
        <div style="margin-top: 30px; display: flex; justify-content: flex-end; gap: 15px;">
            <button onclick="confirmCandidateUpload()" style="background-color: #4CAF50; color: white; border: none; padding: 15px 35px; border-radius: 5px; cursor: pointer; font-size: 20px;">确认</button>
            <button onclick="closeCandidateUploadModal()" style="background-color: #e0e0e0; color: #333; border: none; padding: 15px 35px; border-radius: 5px; cursor: pointer; font-size: 20px;">取消</button>
        </div>
    </div>

    <!-- 候选图上传遮罩层 -->
    <div id="candidateUploadOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1050;"></div>

    <!-- 底部悬浮条 - 修改后 -->
    <div class="footer">
        <div class="footer-content">
            <span class="footer-text">当前确定品种：<span id="selected_variety_name">未选择品种</span></span>
            <div class="footer-buttons">
                <button onclick="goToIndex()">因果图编辑</button>
                <button onclick="checkVarietyAndNavigate('/versions')">版本管理</button>
            </div>
        </div>
    </div>

    <!-- 引入 JavaScript 文件 -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        window.onload = function() {
            // 检测服务器是否重启，如果重启则清空localStorage和sessionStorage
            fetch('/get_server_session')
                .then(r => r.json())
                .then(data => {
                    const lastSessionId = localStorage.getItem('serverSessionId');
                    if (lastSessionId && lastSessionId !== data.session_id) {
                        // 服务器已重启，清空存储
                        localStorage.clear();
                        sessionStorage.clear();
                    }
                    localStorage.setItem('serverSessionId', data.session_id);
                    
                    // 初始化页面
                    initPage();
                })
                .catch(() => {
                    // 请求失败也继续初始化
                    initPage();
                });
        };
        
        function initPage() {
            loadVarieties();
            loadPendingList();
            
            // 恢复确认选择的UI状态
            const selectedVariety = sessionStorage.getItem('selectedVariety');
            if (selectedVariety) {
                const uploadCandidateBtn = document.getElementById("upload_candidate_btn");
                if (uploadCandidateBtn) {
                    uploadCandidateBtn.style.display = "inline-block";
                }
                const selectedVarietyName = document.getElementById("selected_variety_name");
                if (selectedVarietyName) {
                    selectedVarietyName.innerText = selectedVariety;
                }
            }
            
            // 监听模态框中的文件选择事件
            document.getElementById('candidate_file_input').addEventListener('change', function() {
                const fileName = this.value.split('\\').pop();
                const fileDisplay = document.getElementById("candidate_file_name");
                if (fileName) {
                    fileDisplay.innerText = fileName;
                    fileDisplay.style.color = '#4CAF50';
                } else {
                    fileDisplay.innerText = "未选择任何文件";
                    fileDisplay.style.color = '#888';
                }
            });
        }
    </script>
</body>
</html>
